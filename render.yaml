# Render Blueprint — one Docker web service + Postgres (free).
# https://render.com/docs/blueprint-spec
#
# After first deploy, seed once from the service shell:
#   bin/rails db:seed
# Do not seed on every boot (entrypoint only runs db:prepare).

databases:
  - name: acme-salary-db
    plan: free
    databaseName: acme_salary
    user: acme

services:
  - type: web
    name: acme-salary
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: acme-salary-db
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
